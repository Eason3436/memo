# XcodeGen 設定檔：執行 `xcodegen generate` 會產生 MemoApp.xcodeproj
name: MemoApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
targets:
  MemoApp:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MemoApp
        CFBundleName: MemoApp
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: 在備忘錄加上你目前的位置
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.memoapp
        PRODUCT_NAME: MemoApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
