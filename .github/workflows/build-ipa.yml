# 推到 GitHub 後，到 Actions 分頁就能看到自動編譯，完成後下載 MemoApp-unsigned.ipa
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Xcode 27（iOS 27 SDK）的預覽版 runner；公開 repo 不扣每月額度
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 產生 Xcode 專案
        run: xcodegen generate

      - name: 編譯（不簽章）
        run: |
          xcodebuild \
            -project MemoApp.xcodeproj \
            -scheme MemoApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MemoApp.app Payload/
          zip -qr MemoApp-unsigned.ipa Payload

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MemoApp-unsigned-ipa
          path: MemoApp-unsigned.ipa
